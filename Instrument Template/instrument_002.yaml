# ============================================================================
# 手术器械特征配置文件
# Surgical Instrument Feature Configuration
# ============================================================================

# 器械基本信息
instrument:
  id: 002
  name: 手术剪刀
  name_en: Surgical Scissors
  description: 标准手术剪刀，带有四个反光球标记点
  reference_point: Pref

# ============================================================================
# 特征点配置
# Feature Points Configuration
# ============================================================================
# 说明：
# - 每个点包含三条邻接边
# - 每条边记录：目标点ID、边长、局部坐标系下的参考向量
# - 局部坐标系定义：
#   * 原点：当前点
#   * 缺失边：当前边(不参与坐标系构建)
#   * X轴：另外两条边中的第一条
#   * Z轴：X轴 × 第二条边 (叉乘)
#   * Y轴：Z轴 × X轴
# - ref_vector: 参考点在该局部坐标系下的坐标 [x, y, z]
# ============================================================================

points:
  # --------------------------------------------------------------------------
  # 点 P1
  # --------------------------------------------------------------------------
  - id: P1
    edges:
      - to: P2
        length: 120.0              # 单位: mm
        ref_vector: null           # 待程序计算填入
        
      - to: P3
        length: 89.44
        ref_vector: null
        
      - to: P4
        length: 158.11
        ref_vector: null

  # --------------------------------------------------------------------------
  # 点 P2
  # --------------------------------------------------------------------------
  - id: P2
    edges:
      - to: P1
        length: 120.0
        ref_vector: null
        
      - to: P3
        length: 72.11
        ref_vector: null
        
      - to: P4
        length: 58.31
        ref_vector: null

  # --------------------------------------------------------------------------
  # 点 P3
  # --------------------------------------------------------------------------
  - id: P3
    edges:
      - to: P1
        length: 89.44
        ref_vector: null
        
      - to: P2
        length: 72.11
        ref_vector: null
        
      - to: P4
        length: 70.71
        ref_vector: null

  # --------------------------------------------------------------------------
  # 点 P4
  # --------------------------------------------------------------------------
  - id: P4
    edges:
      - to: P1
        length: 158.11
        ref_vector: null
        
      - to: P2
        length: 58.31
        ref_vector: null
        
      - to: P3
        length: 70.71
        ref_vector: null

# ============================================================================
# 元数据
# Metadata
# ============================================================================
metadata:
  unit: mm
  created: 2025-11-28
  version: 1.0
  status: template  # template / calibrated
